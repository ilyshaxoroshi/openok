name: deploy-site

on:
  push:
    branches:
      - dev
    paths:
      - "site/**"
      - "load.png"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page lives in site/ and links the shared mascot asset at the repository root.
      - name: Assemble the static site
        run: |
          mkdir -p _pages
          cp -R site/. _pages/
          cp load.png _pages/load.png
          sed -i 's#\.\./load\.png#./load.png#g' _pages/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v4
