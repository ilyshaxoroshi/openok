<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenOK — Choose a language / Выберите язык</title>
    <meta name="description" content="Choose a language for the OpenOK site. Выберите язык сайта OpenOK." />
    <meta name="theme-color" content="#0d0f14" />
    <link rel="icon" type="image/png" href="../load.png" />
    <link rel="alternate" hreflang="en" href="en.html" />
    <link rel="alternate" hreflang="ru" href="ru.html" />
    <style>
      :root {
        --bg: #0d0f14;
        --card: rgba(255, 255, 255, 0.04);
        --line: rgba(255, 255, 255, 0.1);
        --text: #e8ecf4;
        --muted: #9aa6bd;
        --accent: #7cc4ff;
        --accent-2: #b8a6ff;
        --radius: 18px;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      /* The blurred page behind the dialog: a loose skeleton of the real site, so the
         overlay reads as a modal state instead of a separate screen. */
      .scene {
        position: fixed;
        inset: -6%;
        display: grid;
        align-content: center;
        gap: 46px;
        padding: 0 6%;
        background:
          radial-gradient(1100px 600px at 15% -10%, rgba(124, 196, 255, 0.22), transparent 60%),
          radial-gradient(900px 500px at 90% 0%, rgba(184, 166, 255, 0.2), transparent 60%),
          var(--bg);
        filter: blur(14px) saturate(1.2) brightness(1.05);
        transform: scale(1.04);
        user-select: none;
        pointer-events: none;
      }

      .snav,
      .shero,
      .scards {
        width: min(1120px, 100%);
        margin-inline: auto;
      }

      .snav {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .slogo {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        opacity: 0.85;
      }

      .sbar {
        display: block;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
      }

      .snav .sbar {
        height: 9px;
      }

      .w50 {
        width: 50px;
      }

      .w60 {
        width: 60px;
      }

      .w70 {
        width: 70px;
      }

      .w80 {
        width: 80%;
      }

      .w90 {
        width: 90%;
      }

      .snav .sbtn {
        margin-left: auto;
      }

      .sbtn {
        display: block;
        width: 74px;
        height: 34px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.09);
      }

      .sbtn.big {
        width: 120px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        opacity: 0.9;
      }

      .shero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 40px;
        align-items: center;
      }

      .scol {
        display: grid;
        gap: 16px;
        justify-items: start;
      }

      .spill {
        width: 210px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
      }

      .sbar.tall {
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(90deg, rgba(124, 196, 255, 0.55), rgba(184, 166, 255, 0.5));
        opacity: 0.75;
      }

      .scta {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      .smascot {
        width: 100%;
        height: auto;
        border-radius: 28px;
        opacity: 0.96;
      }

      .scards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .scards span {
        display: block;
        height: 120px;
        border-radius: var(--radius);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
      }

      .veil {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(1000px 620px at 50% 42%, rgba(11, 13, 19, 0.1), rgba(9, 11, 16, 0.58) 76%),
          linear-gradient(180deg, rgba(9, 11, 16, 0.16), rgba(9, 11, 16, 0.5));
        pointer-events: none;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 2;
      }

      .dialog {
        width: min(440px, 100%);
        padding: 30px 28px 24px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: linear-gradient(180deg, rgba(28, 33, 46, 0.94), rgba(16, 19, 27, 0.96));
        box-shadow:
          0 40px 90px -40px rgba(0, 0, 0, 0.95),
          0 0 120px -20px rgba(124, 196, 255, 0.28),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        backdrop-filter: blur(14px);
        text-align: center;
        animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .avatar {
        width: 64px;
        height: 64px;
        margin: 0 auto 14px;
        display: block;
        border-radius: 18px;
        object-fit: cover;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.14),
          0 14px 30px -12px rgba(124, 196, 255, 0.7);
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: -0.3px;
      }

      .subtitle {
        margin: 0 0 24px;
        font-size: 14px;
        color: var(--muted);
      }

      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 18px;
      }

      .choice {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 14px 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease,
          box-shadow 160ms ease;
      }

      .choice .code {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1.2px;
        color: var(--muted);
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid var(--line);
      }

      .choice:hover {
        transform: translateY(-1px);
        text-decoration: none;
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
        background: color-mix(in srgb, var(--accent) 12%, var(--card));
      }

      .choice:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
        outline-offset: 3px;
      }

      .choice[data-saved="true"] {
        border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
        box-shadow: 0 0 0 3px rgba(124, 196, 255, 0.12);
      }

      .hint {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        opacity: 0.75;
      }

      @media (max-width: 420px) {
        .choices {
          grid-template-columns: 1fr;
        }

        .dialog {
          padding: 26px 20px 20px;
        }
      }

      @media (max-width: 760px) {
        .shero {
          grid-template-columns: minmax(0, 1fr);
        }

        .smascot {
          display: none;
        }

        .scards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dialog {
          animation: none;
        }

        .choice {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="snav">
        <span class="slogo"></span>
        <span class="sbar w60"></span>
        <span class="sbar w50"></span>
        <span class="sbtn"></span>
      </div>
      <div class="shero">
        <div class="scol">
          <span class="spill"></span>
          <span class="sbar tall w90"></span>
          <span class="sbar tall w70"></span>
          <span class="sbar w80"></span>
          <span class="sbar w70"></span>
          <span class="scta"><span class="sbtn big"></span><span class="sbtn"></span></span>
        </div>
        <img class="smascot" src="../load.png" alt="" />
      </div>
      <div class="scards"><span></span><span></span><span></span></div>
    </div>

    <div class="veil" aria-hidden="true"></div>

    <main class="stage">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-subtitle">
        <img class="avatar" src="../load.png" alt="" width="64" height="64" />
        <p class="eyebrow">OpenOK</p>
        <h1 id="dialog-title" lang="ru">Выберите язык</h1>
        <p class="subtitle" id="dialog-subtitle" lang="en">Choose a language</p>
        <div class="choices">
          <a class="choice" href="en.html" hreflang="en" lang="en" data-lang="en">
            <span class="code">EN</span>
            <span>English</span>
          </a>
          <a class="choice" href="ru.html" hreflang="ru" lang="ru" data-lang="ru">
            <span class="code">RU</span>
            <span>Russian</span>
          </a>
        </div>
        <p class="hint">Язык можно сменить позже · You can switch later</p>
      </section>
    </main>

    <script>
      const choices = Array.from(document.querySelectorAll(".choice"))
      const saved = localStorage.getItem("openok.lang")

      // Highlight the language used last time, then keep the choice for the language pages.
      for (const choice of choices) {
        if (choice.dataset.lang === saved) {
          choice.dataset.saved = "true"
          choice.focus({ preventScroll: true })
        }
        choice.addEventListener("click", () => localStorage.setItem("openok.lang", choice.dataset.lang))
      }
    </script>
  </body>
</html>
